name: Feature request
description: Something the status line should show or do.
labels: ["type: feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you cannot see or do today, and when it matters.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What it should show. Name the field from the status line input it would use, if you know it.
  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints
      options:
        - label: Nothing it adds to the render path waits on the network or on a subprocess, or the proposal says how it avoids that.
